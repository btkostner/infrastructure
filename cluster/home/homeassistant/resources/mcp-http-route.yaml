apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant-mcp-http
  namespace: home
spec:
  hostnames:
    - ha-mcp.btkostner.network
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      namespace: networking
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: homeassistant-mcp
          port: 9583
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
