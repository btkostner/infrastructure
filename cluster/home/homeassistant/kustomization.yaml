apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: homeassistant

namespace: home

resources:
  - ./resources/endpoints.yaml
  - ./resources/http-route.yaml
  - ./resources/http-route-external-webhook.yaml
  - ./resources/mcp-endpoints.yaml
  - ./resources/mcp-http-route.yaml
  - ./resources/mcp-service.yaml
  - ./resources/service.yaml
