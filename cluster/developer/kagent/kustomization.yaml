apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: kagent

namespace: developer

helmCharts:
  - name: kagent-crds
    repo: oci://ghcr.io/kagent-dev/kagent/helm
    releaseName: kagent-crds
    namespace: developer
    version: 0.10.6
    includeCRDs: true
    valuesInline:
      kmcp:
        enabled: true
      substrate:
        enabled: false
  - name: kagent
    repo: oci://ghcr.io/kagent-dev/kagent/helm
    releaseName: kagent
    namespace: developer
    version: 0.10.6
    valuesFile: ./values.yaml

resources:
  - ./resources/database.yaml
  - ./resources/http-route.yaml
  - ./resources/secret-openai.yaml

patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-2"
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true
