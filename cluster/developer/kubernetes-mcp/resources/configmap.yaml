apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp
data:
  config.toml: |
    port = "8080"
    stateless = true
    read_only = true
    cluster_provider_strategy = "in-cluster"
    cluster_auth_mode = "kubeconfig"

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"

    [[denied_resources]]
    group = "external-secrets.io"
    version = "v1"
    kind = "ExternalSecret"

    [[denied_resources]]
    group = "external-secrets.io"
    version = "v1"
    kind = "ClusterSecretStore"

    [[denied_resources]]
    group = "external-secrets.io"
    version = "v1"
    kind = "SecretStore"

    [[denied_resources]]
    group = "external-secrets.io"
    version = "v1"
    kind = "PushSecret"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "Role"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "RoleBinding"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "ClusterRole"

    [[denied_resources]]
    group = "rbac.authorization.k8s.io"
    version = "v1"
    kind = "ClusterRoleBinding"
