apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-mcp-http
spec:
  hostnames:
    - argocd-mcp.btkostner.network
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      namespace: networking
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: argocd-mcp
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /mcp
