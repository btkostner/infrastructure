apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  labels:
    app: argocd-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argocd-mcp
          image: node:24.18.0-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
          command:
            - npx
          args:
            - --yes
            - argocd-mcp@0.9.0
            - http
            - --allowed-host-header
            - argocd-mcp.btkostner.network
            - --bind-address
            - 0.0.0.0
            - --port
            - "8080"
            - --allow-unauthenticated
          env:
            - name: ARGOCD_BASE_URL
              value: https://argocd.btkostner.network
            - name: MCP_READ_ONLY
              value: "true"
            - name: NPM_CONFIG_CACHE
              value: /tmp/npm-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
