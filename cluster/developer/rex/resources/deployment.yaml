apiVersion: apps/v1
kind: Deployment
metadata:
  name: rex
  namespace: developer
  labels:
    app: rex
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rex
  template:
    metadata:
      labels:
        app: rex
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: rex
          image: ghcr.io/btkostner/rex:sha-ed1afe4
          imagePullPolicy: Always
          ports:
            - containerPort: 7297
              name: rex
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 7297
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7297
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rex-github
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rex-data
