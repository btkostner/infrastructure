apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaver
  namespace: download
  labels:
    app: weaver
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weaver
  template:
    metadata:
      labels:
        app: weaver
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: weaver
          image: ghcr.io/scryer-media/weaver:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 8G
            limits:
              cpu: "4"
              memory: 16G
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: WEAVER_INTERMEDIATE_DIR
              value: /download/intermediate
            - name: WEAVER_COMPLETE_DIR
              value: /download/complete
            - name: WEAVER_SECURE_COOKIES
              value: "true"
            - name: WEAVER_BOOTSTRAP_LOGIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: weaver-login
                  key: username
            - name: WEAVER_BOOTSTRAP_LOGIN_PASSWORD_FILE
              value: /run/secrets/weaver-login/password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: download
              mountPath: /download
            - name: login
              mountPath: /run/secrets/weaver-login
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: weaver-config
        - name: download
          persistentVolumeClaim:
            claimName: weaver-download
        - name: login
          secret:
            secretName: weaver-login
            defaultMode: 0440
            items:
              - key: password
                path: password
