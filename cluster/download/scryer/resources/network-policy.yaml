apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: scryer
  namespace: download
spec:
  endpointSelector:
    matchLabels:
      app: scryer
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
