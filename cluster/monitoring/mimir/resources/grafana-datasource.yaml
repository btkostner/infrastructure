apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        uid: PAE45454D0EDB9216
        url: http://mimir-gateway/prometheus
        access: proxy
        isDefault: true
      # Ceph dashboard's shipped frontend hardcodes the Grafana datasource
      # name for embedded metrics iframes to the literal string "Dashboard1"
      # (ceph-mgr dashboard module, compiled JS: this.datasource =
      # "metrics" === this.type ? "Dashboard1" : ...). There is no backend
      # config key to override this -- the datasource must exist under this
      # exact name or Ceph's embedded Grafana panels fail with a Prometheus
      # API error. Points at the same backend as Mimir above.
      - name: Dashboard1
        type: prometheus
        url: http://mimir-gateway/prometheus
        access: proxy
      - name: Alertmanager
        type: alertmanager
        url: http://mimir-gateway/alertmanager
        access: proxy
        jsonData:
          implementation: mimir
          handleGrafanaManagedAlerts: true
