apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: memberlist
    app.kubernetes.io/version: 3.2.0
    helm.sh/chart: mimir-distributed-6.2.0
  name: mimir-gateway
  namespace: monitoring
spec:
  endpoints:
    - port: http-metrics
      relabelings:
        - action: replace
          replacement: monitoring/gateway
          sourceLabels:
            - job
          targetLabel: job
        - action: replace
          replacement: mimir
          targetLabel: cluster
      scheme: http
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values:
          - "false"
    matchLabels:
      app.kubernetes.io/component: gateway
      app.kubernetes.io/instance: mimir
      app.kubernetes.io/name: mimir
