apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: immich

namespace: media

helmCharts:
  - name: immich
    repo: oci://ghcr.io/immich-app/immich-charts
    releaseName: immich
    namespace: media
    version: 0.13.4
    valuesFile: values.yaml

resources:
  - ./resources/backup-bucket.yaml
  - ./resources/database.yaml
  - ./resources/http-route.yaml
  - ./resources/pv-photos.yaml
  - ./resources/pvc-photos.yaml
