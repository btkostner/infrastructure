apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: rook-ceph

namespace: rook-ceph

helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    releaseName: rook-ceph
    namespace: rook-ceph
    version: v1.20.9
    valuesFile: ./values.yaml
  - name: ceph-csi-drivers
    repo: https://ceph.github.io/ceph-csi-operator
    releaseName: ceph-csi-drivers
    namespace: rook-ceph
    version: 1.1.0
    valuesFile: ./values-csi-drivers.yaml

resources:
  - https://github.com/rook/rook/raw/v1.20.9/deploy/examples/toolbox-operator-image.yaml
  - ./resources/ceph-block-pool-danger.yaml
  - ./resources/ceph-block-pool-safe.yaml
  - ./resources/ceph-cluster.yaml
  - ./resources/ceph-mgr-servicemonitor.yaml
  - ./resources/ceph-object-store.yaml
  - ./resources/http-route.yaml
  - ./resources/storage-class-block-danger.yaml
  - ./resources/storage-class-block-safe.yaml
  - ./resources/storage-class-object.yaml
