apiVersion: v1
kind: Service
metadata:
  name: blocky-dns
  namespace: networking
  labels:
    app: blocky
    app.kubernetes.io/name: blocky
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.3.61
  externalTrafficPolicy: Cluster
  selector:
    app: blocky
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
