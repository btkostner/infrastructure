apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-config
  namespace: networking
  labels:
    app: blocky
data:
  config.yml: |
    upstreams:
      groups:
        default:
          - 1.1.1.1
          - 8.8.8.8

    customDNS:
      mapping:
        btkostner.network: 192.168.3.52
        cluster.btkostner.network: 192.168.3.10
        kvm.btkostner.network: 192.168.3.2
        behemoth.btkostner.network: 192.168.3.4

    blocking:
      denylists:
        blocking:
          - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
          # Migrated from the UniFi "Personal" content-filter custom block list,
          # which was disabled because UniFi content filtering intercepts all
          # client DNS and prevents queries from ever reaching blocky.
          - |
            googleadservices.com
            www.googleadservices.com
            advertising.apple.com
            iadsdk.apple.com
            tr.iadsdk.apple.com
            api-adservices.apple.com
      clientGroupsBlock:
        default:
          - blocking
      blockType: zeroIp
      loading:
        refreshPeriod: 24h

    caching:
      minTime: 5m
      maxTime: 30m

    prometheus:
      enable: true
      path: /metrics

    ports:
      dns:
        - 53
      http: 4000
