apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: external-secrets-operator

namespace: external-secrets

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    releaseName: external-secrets
    namespace: external-secrets
    # Path 0.14 -> 0.16 (serves v1 and v1beta1) -> manifests to v1 -> latest (0.17+ stops serving v1beta1).
    version: 2.15.0 # 2.15.0 as at 20261115 https://github.com/external-secrets/external-secrets/releases
    valuesFile: values.yaml

resources:
  - ./resources/namespace.yaml
  # - ./resources/bitwarden-cluster-certificate-issuer.yaml
  - ./resources/bitwarden-certificate.yaml
  # - ./resources/bitwarden-certificate-bundle.yaml
  - ./resources/cluster-secret-store.yaml

patches:
  # The sdk server only loads its TLS cert at startup. Have Reloader restart it
  # whenever cert-manager renews bitwarden-tls-certs.
  - target:
      kind: Deployment
      name: bitwarden-sdk-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bitwarden-sdk-server
        annotations:
          secret.reloader.stakater.com/reload: "bitwarden-tls-certs"
