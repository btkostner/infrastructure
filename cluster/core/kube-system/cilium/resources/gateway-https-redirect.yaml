# Redirect every plain-HTTP request on the gateway's port 80 to HTTPS (301), like ingress-nginx's ssl-redirect.
# App HTTPRoutes attach to the `https` listener only (parentRefs.sectionName: https); a route without sectionName
# would also attach to `http` and, being more specific than this hostname-less route, serve plain HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: external-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
