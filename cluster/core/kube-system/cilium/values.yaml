cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# The chart defaults debug.verbose, nodePort.addresses and policyCIDRMatchMode to null and only renders
# them when the key exists. Helm 3 kept null keys, Helm 4 (Argo CD 3.5+) drops them; set them explicitly
# so cilium-config (and its checksum, which restarts Cilium) is the same under both. Empty = Cilium default.
debug:
  enabled: true
  verbose: ""
enableRuntimeDeviceDetection: true
endpointRoutes:
  enabled: true
externalIPs:
  enabled: true
fqdn: # added from chatgpt recommendation
  enablePoller: true # added from chatgpt recommendation
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: false # if this is on it disables the use of Cilium's internal loadbalancer when creating gateways
  secretsNamespace:
    create: false
    name: kube-system
hostPort:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
    frontend:
      server:
        ipv6:
          enabled: false
    ingress:
      # Served by resources/hubble-ui-httproute.yaml on the Gateway API instead (2026-11-15).
      enabled: false

ingressController:
  enabled: false
  secretsNamespace:
    create: false
    name: kube-system
# installCRDs: true
ipam:
  mode: kubernetes
k8sClientRateLimit:
  burst: 50
  qps: 200
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
l2announcements:
  enabled: true
  interfaces:
   - eno2 # temporary to allow metallb to announce
policyCIDRMatchMode: []
l7Proxy: true # is on by default, but we need it so being explicit
nodePort:
  enabled: true
  addresses: []
operator:
  rollOutPods: true
  replicas: 1 # reduced to one because of single node cluster
  podDisruptionBudget:
    enabled: true
policyEnforcementMode: default # THIS WAS WRONG # added from chatgpt recommendation
rollOutCiliumPods: true
securityContext:
  capabilities:
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
socketLB:
  enabled: true
