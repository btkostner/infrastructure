# Supplements the built-in `view` ClusterRole (which already excludes Secrets and has pods/log)
# with cluster-scoped and CRD objects. RBAC cannot express "everything except secrets", so
# groups are listed explicitly. Deliberately NOT included: secrets, pods/exec|attach|portforward,
# serviceaccounts/token, nodes/proxy, any write verb.
# A new CRD group needs adding here to be visible.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes, componentstatuses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io, node.k8s.io, scheduling.k8s.io, coordination.k8s.io, certificates.k8s.io, events.k8s.io, policy, admissionregistration.k8s.io, rbac.authorization.k8s.io, networking.k8s.io, discovery.k8s.io, apps, batch, autoscaling]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  # Operators/CRDs in this cluster
  - apiGroups: [argoproj.io, cilium.io, cert-manager.io, acme.cert-manager.io, trust.cert-manager.io, external-secrets.io, generators.external-secrets.io, k8s.keycloak.org, gateway.networking.k8s.io, snapshot.storage.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
