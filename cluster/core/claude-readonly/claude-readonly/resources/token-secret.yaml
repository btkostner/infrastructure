# Long-lived token for the ServiceAccount, minted by the token controller (no secret
# material is stored in git). Rotate by deleting this Secret; Argo CD recreates it.
apiVersion: v1
kind: Secret
metadata:
  name: claude-readonly-token
  namespace: claude-readonly
  annotations:
    kubernetes.io/service-account.name: claude-readonly
type: kubernetes.io/service-account-token
