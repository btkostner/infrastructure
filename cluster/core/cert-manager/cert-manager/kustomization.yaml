apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cert-manager

namespace: cert-manager

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    releaseName: cert-manager
    version: v1.21.3 # v1.21.3 as at 20261115 https://github.com/cert-manager/cert-manager/releases
    # version: v1.17.0
    namespace: cert-manager
    valuesFile: ./values.yaml

resources:
  - ./resources/namespace.yaml
  - ./resources/secret-cloudflare-credentials.yaml
  - ./resources/cluster-issuer-production.yaml
  - ./resources/cluster-issuer-staging.yaml
