apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: k8s-device-plugin

namespace: nvidia-device-plugin

resources:
  - ./resources/namespace.yaml
  - ./resources/runtimeclass.yaml

helmCharts:
  - name: nvidia-device-plugin
    repo: https://nvidia.github.io/k8s-device-plugin
    # No releaseName: objects keep the default `release-name-` prefix; setting one would rename (recreate) them all.
    version: 0.20.1 # 0.20.1 as at 20261115 https://github.com/NVIDIA/k8s-device-plugin/releases
    namespace: nvidia-device-plugin
    valuesFile: ./values.yaml

