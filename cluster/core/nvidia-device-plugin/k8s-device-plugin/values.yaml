# https://github.com/NVIDIA/k8s-device-plugin/blob/v0.20.1/deployments/helm/nvidia-device-plugin/values.yaml
gfd:
  enabled: true
runtimeClassName: nvidia
# nfd: # nfd is already installed in the cluster 
#   enabled: false
migStrategy: "single"
# Both nodes have a GPU; maurice is tainted workload=LargeWorkload:NoSchedule. Without this toleration the
# DaemonSets only kept their maurice pods because NoSchedule doesn't evict; any rollout would drop the GPU there.
# Lists replace the chart defaults, so the defaults are repeated.
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: workload
    operator: Equal
    value: LargeWorkload
    effect: NoSchedule
nfd:
  worker:
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Equal
        value: ""
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: workload
        operator: Equal
        value: LargeWorkload
        effect: NoSchedule
