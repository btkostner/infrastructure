# kustomization.yaml
# Adapted from here: https://www.talos.dev/v1.9/kubernetes-guides/configuration/local-storage/
# Required for KubeVirt
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: local-path-storage
resources:
  - github.com/rancher/local-path-provisioner/deploy?ref=v0.0.31 # v0.0.31 as at 20250215  https://github.com/rancher/local-path-provisioner
patches:
  - patch: |-
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |-
          {
                  "nodePathMap":[
                  {
                          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                          "paths":["/var/local-path-provisioner"]
                  }
                  ]
          }
        # Helper pods create/delete volume directories on the volume's node. Tolerate maurice's
        # workload=LargeWorkload:NoSchedule taint so volumes there don't hang in Pending; pin busybox.
        helperPod.yaml: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
              - key: workload
                operator: Equal
                value: LargeWorkload
                effect: NoSchedule
            containers:
            - name: helper-pod
              image: busybox:1.38.0 # 1.38.0 as at 20261115 https://hub.docker.com/_/busybox
              imagePullPolicy: IfNotPresent
  # - patch: |-
  #     apiVersion: storage.k8s.io/v1
  #     kind: StorageClass
  #     metadata:
  #       name: local-path
  #       annotations:
  #         storageclass.kubernetes.io/is-default-class: "true"    
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          pod-security.kubernetes.io/enforce: privileged    