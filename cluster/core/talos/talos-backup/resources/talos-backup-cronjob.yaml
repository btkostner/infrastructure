# https://github.com/siderolabs/talos-backup/blob/main/cronjob.sample.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
spec:
  # Hourly: the snapshot is the whole etcd DB (~166 MB uncompressed, 2026-11-17); the NAS keeps 14 days.
  schedule: "17 * * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          automountServiceAccountToken: false # Talos API access comes from the talos-backup-secrets volume
          hostAliases:
            - ip: "10.20.10.1"
              hostnames:
                - "spiff.rockyroad.rocks"
          containers:
          - name: talos-backup
            # v0.1.0 as at 20261117 https://github.com/siderolabs/talos-backup/releases
            image: ghcr.io/siderolabs/talos-backup:v0.1.0@sha256:3635df0be0862d71bba7a34dca3e7f7c790887f5c5d0129002191c4c2d92dd15
            workingDir: /tmp
            imagePullPolicy: IfNotPresent
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: talos-backup-externalsecrets
                    key: access-key-id
              - name: AWS_SECRET_ACCESS_KEY
                # consider storing this as a secret.
                valueFrom:
                  secretKeyRef:
                    name: talos-backup-externalsecrets
                    key: secret-access-key
              - name: AWS_REGION
                value: us-east-1 # must match the S3 server's region (SigV4)
              # CUSTOM_S3_ENDPOINT is optional; if omitted the service will fallback to default AWS endpoints.
              - name: CUSTOM_S3_ENDPOINT
                valueFrom:
                  secretKeyRef:
                    name: talos-backup-externalsecrets
                    key: endpoint
              - name: BUCKET
                value: talos-backup
              # CLUSTER_NAME is optional; if omitted it will fall back to the name of the default context.
              - name: CLUSTER_NAME
                value: "talos-gpu"
              # S3_PREFIX is optional; if omitted it will fall back to the cluster name.
              - name: S3_PREFIX
                value: "talos-gpu/backups"
              - name: AGE_X25519_PUBLIC_KEY
                valueFrom:
                  secretKeyRef:
                    name: talos-backup-externalsecrets
                    key: age-public-key
              # Path-style (https://endpoint/bucket/key) is the default with CUSTOM_S3_ENDPOINT since v0.1.0;
              # "false" switches to virtual-hosted style (https://bucket.endpoint/key), which needs wildcard DNS.
              - name: USE_PATH_STYLE
                value: "true"
              # zstd before age encryption; etcd's DB is mostly free pages, so this shrinks it a lot.
              - name: ENABLE_COMPRESSION
                value: "true"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            command:
            - /talos-backup
            volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /.talos # fix as per: https://github.com/siderolabs/talos-backup/issues/27
              name: talos
            - mountPath: /var/run/secrets/talos.dev
              name: talos-secrets
          restartPolicy: OnFailure
          volumes:
          - emptyDir: {}
            name: tmp
          - emptyDir: {} # fix as per: https://github.com/siderolabs/talos-backup/issues/27
            name: talos
          - name: talos-secrets
            secret:
              secretName: talos-backup-secrets
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
    name: talos-backup-secrets
spec:
    roles:
        - os:etcd:backup
# Talos creates the Secret talos-backup-secrets (Talos API credentials with the roles above) from this
# resource; don't define it here: Talos refuses to manage a Secret it didn't create.
