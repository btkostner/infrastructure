apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ugoogalizer/kubernetes-talos.git
    targetRevision: HEAD
    path: cluster/core/argocd/argocd   # uses EXISTING kustomization
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Server-side apply avoids the 262144-byte last-applied annotation limit on the
      # Argo CD CRDs without Replace=true, which overwrote fields Argo CD writes at
      # runtime (e.g. argocd-secret) on every sync. Do not switch back to Replace.
      - ServerSideApply=true
