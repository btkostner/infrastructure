apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: core
  name: core
  namespace: argocd
spec:
  generators:
    - git:
        files:
          - path: cluster/core/*/*/kustomization.yaml #the argo manifest is here at \cluster\core\argocd\argocd\kustomization.yaml\
          - path: cluster/core/argocd/argocd/kustomization.yaml # has to be deployed as a dedicated application so we can add the Replace=true flag
            exclude: true
        repoURL: https://github.com/ugoogalizer/kubernetes-talos.git
        requeueAfterSeconds: 20
        revision: HEAD
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/name: "{{path.basenameNormalized}}"
      name: "{{path.basenameNormalized}}"
      namespace: "{{path[2]}}"
    spec:
      destination:
        server: https://kubernetes.default.svc
        # Folder name = namespace. Catches Helm-rendered resources that don't set metadata.namespace
        # (Kustomize >= 5.8, bundled from Argo CD 3.3, no longer applies `namespace:` to Helm output).
        namespace: "{{path[2]}}"
      project: default
      source:
        path: "{{path}}"
        repoURL: https://github.com/ugoogalizer/kubernetes-talos.git
      syncPolicy:
        automated:
          allowEmpty: false
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          # - ServerSideApply=true # added 20260121 to resolve an issue with argo updating and throwing 'CustomResourceDefinition.apiextensions.k8s.io "applicationsets.argoproj.io" is invalid: metadata.annotations: Too long: may not be more than 262144 bytes'
          # - Replace=true # 
      ignoreDifferences:
        - group: ""
          kind: PersistentVolumeClaim
          jsonPointers:
            - /metadata/uid
            - /spec/volumeName
        - group: ""
          kind: ConfigMap
          jsonPointers:
            - /data/ca.crt
            - /data/ca.key
            - /data/tls.crt
            - /data/tls.key
        - group: ""
          kind: Secret
          jsonPointers:
            - /data/ca.crt
            - /data/ca.key
            - /data/tls.crt
            - /data/tls.key
        # Service-account token Secret: the token controller fills in data (token, namespace, ca.crt).
        - group: ""
          kind: Secret
          name: claude-readonly-token
          namespace: claude-readonly
          jsonPointers:
            - /data
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /metadata/annotations
        # - group: ceph.rook.io
        #   kind: CephCluster
        #   jsonPointers:
        #     - /spec/cephVersion
        #     - /spec/cleanupPolicy
        #     - /spec/continueUpgradeAfterChecksEvenIfNotHealthy
        #     - /spec/crashCollector
        #     - /spec/dashboard
        #     - /spec/disruptionManagement
        #     - /spec/disruptionManagement/managePodBudgets
        #     - /spec/healthCheck
        #     - /spec/mgr
        #     - /spec/mon
        #     - /spec/monitoring
        #     - /spec/network/connections
        #     - /spec/removeOSDsIfOutAndSafeToRemove
        #     - /spec/skipUpgradeChecks
        #     - /spec/storage/onlyApplyOSDPlacement

        # This is a workaround for mutated CRD, where ingoreDifferences must be set
        # https://github.com/metallb/metallb/issues/1681
        - group: "apiextensions.k8s.io"
          kind: CustomResourceDefinition
          name: addresspools.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
        - group: "apiextensions.k8s.io"
          kind: CustomResourceDefinition
          name: bgppeers.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
          - .spec.conversion.webhook.clientConfig.caBundle
          - .spec.conversion.webhook.clientConfig.service.name
          - .spec.conversion.webhook.clientConfig.service.namespace
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle
        # Ignore the entire data field in the metallb-webhook-cert as it is managed by an external controller
        - group: ""
          kind: Secret
          name: metallb-webhook-cert
          namespace: metallb-system
          jsonPointers:
            - /data
