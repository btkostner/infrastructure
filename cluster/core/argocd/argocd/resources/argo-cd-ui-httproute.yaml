# Argo CD UI, served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is
# terminated at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by
# kube-system/https-redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-cd-ui
  annotations:
    gethomepage.dev/description: GitOps Continuous Delivery for Kubernetes
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Network Services
    gethomepage.dev/icon: argocd
    gethomepage.dev/name: Argo CD
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - argo-cd.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80 # Service port "http" → 8080; argocd-server runs with server.insecure
      # The UI keeps long-lived event streams open; Cilium leaves Envoy's 15 s route timeout in place unless a
      # timeout is set, and 0s disables it.
      timeouts:
        request: 0s
