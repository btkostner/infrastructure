# SCRAPED https://artifacthub.io/packages/helm/ollama-helm/ollama/0.4.0

# https://artifacthub.io/packages/helm/open-webui/open-webui

# Note you can access the ollama api at: http://open-webui-ollama.ollama.svc.cluster.local:11434

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-helm
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    # name: talos-gpu
    server: https://kubernetes.default.svc
    namespace: ollama
  project: default
  sources:
  - chart: open-webui
    repoURL: https://helm.openwebui.com/
    # targetRevision: 5.13.0 # 5.13.0 as at 20250216
    # targetRevision: 8.11.0  #8.11.0 as at 20251015
    targetRevision: 10.2.1  #8.11.0 as at 20260120
    helm:
      values: |
        ollama:
          runtimeClassName: "nvidia" # Required to make the nvidia drivers available
          ollama:
            gpu:
              # -- Enable GPU integration
              enabled: true
              # -- GPU type: 'nvidia' or 'amd'
              type: 'nvidia'
              # -- Specify the number of GPU to 1
              number: 1
          ingress:
            # Served by cluster/apps/charts/open-webui (HTTPRoute "ollama") instead (2026-11-15).
            enabled: false
          persistentVolume:
            enabled: true
        extraEnvVars:
          - name: WEBUI_URL
            value: "https://open-webui.rockyroad.rocks"
        pipelines:
          enabled: true
        tika:
          enabled: true
        ingress:
          # Served by cluster/apps/charts/open-webui (HTTPRoute "open-webui") instead (2026-11-15).
          enabled: false
  # HTTPRoutes for open-webui.rockyroad.rocks and ollama.rockyroad.rocks (the chart has no Gateway API option)
  - path: cluster/apps/charts/open-webui
    repoURL: https://github.com/ugoogalizer/kubernetes-talos.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

