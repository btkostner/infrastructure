
# https://github.com/iib0011/omni-tools
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: omni-tools
  name: omni-tools
#  namespace: omni-tools
spec:
  selector:
    matchLabels:
      app: omni-tools
  template:
    metadata:
      labels:
        app: omni-tools
        app.kubernetes.io/name: omni-tools # required for Homepage
    spec:
      containers:
        - name: omni-tools
          # https://github.com/omni-tools-app/omni-tools/pkgs/container/omni-tools 
          image: iib0011/omni-tools:latest
          imagePullPolicy: Always
          env:
            # - name: PUID
            #   value: "1000"
            # - name: PGID
            #   value: "1000"
            - name: TZ
              value: "Australia/Sydney"
          ports:
            - containerPort: 80
              name: omni-tools-http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
            limits:
              cpu: "1000m"
              memory: "2000Mi"
          livenessProbe:
            httpGet:
              path: /
              port: omni-tools-http
          readinessProbe:
            httpGet:
             path: /
             port: omni-tools-http
          startupProbe:
            httpGet:
              path: /
              port: omni-tools-http
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: omni-tools-http-svc
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: omni-tools-http
  selector:
    app: omni-tools
  type: ClusterIP
---
# Served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is terminated
# at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by kube-system/https-redirect.
# No request body limit on the gateway. Cilium leaves Envoy's 15 s route timeout in place unless a timeout is set;
# 0s disables it, closest to nginx (which had no total request timeout, only idle timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omni-tools
  annotations:
    gethomepage.dev/description: "Variety of online tools to simplify everyday tasks"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Productivity"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/iib0011/omni-tools/main/public/favicon.png"
    gethomepage.dev/name: "OmniTools"
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - omni-tools.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: omni-tools-http-svc
          port: 80
      timeouts:
        request: 0s
---