
# https://docs.mealie.io/documentation/getting-started/installation/installation-checklist/
# https://docs.mealie.io/documentation/getting-started/installation/postgres/

--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mealie
  name: mealie
#  namespace: mealie
spec:
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
        app.kubernetes.io/name: mealie # required for Homepage
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.9.2 # https://github.com/mealie-recipes/mealie/pkgs/container/mealie
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Australia/Sydney"
            - name: ALLOW_SIGNUP
              value: "false"
            - name: BASE_URL
              value: https://mealie.rockyroad.rocks
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_USER
              value: mealie
            - name: POSTGRES_SERVER
              value: postgres-service
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-externalsecrets
                  key: mealie-postgres-password
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/rockyroadrocks/.well-known/openid-configuration
              # value: https://keycloak.rockyroad.rocks/realms/rockyroadrocks/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: mealie
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-externalsecrets
                  key: mealie-oidc-client-secret
            - name: OIDC_PROVIDER_NAME
              value: Rockyroad
            - name: OIDC_USER_GROUP
              value: mealie-users
            - name: OIDC_ADMIN_GROUP
              value: mealie-admins
              
            # - name: OPENAI_BASE_URL
            #   # value: http://open-webui-ollama.ollama.svc.cluster.local:11434
            #   # value: http://open-webui.ollama.svc.cluster.local:80
            #   # value: http://open-webui.ollama.svc.cluster.local:80/api #/openai
            #   # value: http://open-webui.ollama.svc.cluster.local:80/v1
            #   value: http://open-webui.ollama.svc.cluster.local:80/api/v1
            # - name: OPENAI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: mealie-externalsecrets
            #       key: mealie-openai-key
            # - name: OPENAI_MODEL
            #   # value: "qwen3:4b"
            #   value: "qwen3:1.7b"
            # - name: OPENAI_WORKERS
            #   value: "1"
            # - name: OPENAI_SEND_DATABASE_DATA
            #   value: "false"

            # TODO:       
            # - name: OpenID Connect
            #   value: 
            # - name: SMTP
            #   value: 
            # - name: 
            #   value: 
            # - name: 
            #   value: 
          ports:
            - containerPort: 9000 # or 9925, not well documented
              name: mealie-http
              protocol: TCP
          resources:
            requests:
              cpu: 1000m
              memory: 1000Mi
            limits:
              cpu: "2000m"
              memory: "2000Mi"
          volumeMounts:
            - mountPath: /app/data/
              name: mealie-storage-pv
      volumes:
        - name: mealie-storage-pv
          # If this is NFS backed, you may have to add the nolock mount option to the storage class
          persistentVolumeClaim:
            claimName: mealie-storage-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-storage-pvc
spec:
  storageClassName: managed-nfs-storage-retain
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: mealie-http-svc
spec:
  ports:
    - name: http
      port: 9000
      protocol: TCP
      targetPort: mealie-http
  selector:
    app: mealie
  type: ClusterIP
---
# Served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is terminated
# at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by kube-system/https-redirect.
# No request body limit on the gateway. Cilium leaves Envoy's 15 s route timeout in place unless a timeout is set;
# 0s disables it, closest to nginx (which had no total request timeout, only idle timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  annotations:
    gethomepage.dev/description: "Recipe management"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Lifestyle"
    gethomepage.dev/icon: "mealie"
    gethomepage.dev/name: "Mealie"
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - mealie.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mealie-http-svc
          port: 9000
      timeouts:
        request: 0s
---