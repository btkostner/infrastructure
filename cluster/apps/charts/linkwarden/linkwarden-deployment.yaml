
# https://github.com/linkwarden/linkwarden/blob/main/docker-compose.yml
# https://github.com/linkwarden/linkwarden/blob/main/.env.sample

--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: linkwarden
  name: linkwarden
#  namespace: linkwarden
spec:
  selector:
    matchLabels:
      app: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
        app.kubernetes.io/name: linkwarden # required for Homepage
    spec:
      containers:
        - name: linkwarden
          # https://github.com/linkwarden/linkwarden/pkgs/container/linkwarden
          image: ghcr.io/linkwarden/linkwarden:v2.13.5 # v2.13.5 as at 20260120
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Australia/Sydney"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkwarden-externalsecrets
                  key: linkwarden-nextauth-secret # templated by external secrets
            - name: NEXTAUTH_URL
              value: "http://localhost:3000/api/v1/auth"
            - name: DATABASE_URL
              # value: "postgresql://postgres:${POSTGRES_PASSWORD}@db"
              valueFrom:
                secretKeyRef:
                  name: linkwarden-externalsecrets
                  key: linkwarden-postgres-url # templated by external secrets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkwarden-externalsecrets
                  key: linkwarden-postgres-secret # templated by external secrets
            - name: MEILI_HOST
              value: http://meilisearch:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: linkwarden-externalsecrets
                  key: linkwarden-meili-secret # templated by external secrets
            - name: POSTGRES_TIMEOUT
              value: "60"
          ports:
            - containerPort: 3000
              name: linkwarden-http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 1000Mi
            limits:
              cpu: "1000m"
              memory: "2000Mi"
          livenessProbe:
            httpGet:
              path: /
              port: linkwarden-http
          readinessProbe:
            httpGet:
             path: /
             port: linkwarden-http
          startupProbe:
            httpGet:
              path: /
              port: linkwarden-http
            failureThreshold: 30
          volumeMounts:
            - name: linkwarden-data
              mountPath: /data/data
      volumes:
        - name: linkwarden-data
          persistentVolumeClaim:
            claimName: linkwarden-data-pvc
--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: linkwarden
  name: meilisearch
#  namespace: linkwarden
spec:
  selector:
    matchLabels:
      app: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
        app.kubernetes.io/name: linkwarden # required for Homepage
    spec:
      containers:
        - name: meilisearch
          # https://hub.docker.com/r/getmeili/meilisearch/tags
          image: getmeili/meilisearch:v1.12.8 # v1.12.8 as at 20260120
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Australia/Sydney"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: linkwarden-externalsecrets
                  key: linkwarden-meili-secret # templated by external secrets
            - name: MEILI_MAX_INDEXING_MEMORY
              value: "1500Mb"
          ports:
            - containerPort: 7700
              name: meilisearch
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 1000Mi
            limits:
              cpu: "2000m"
              memory: "2000Mi"
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: linkwarden-http
          # readinessProbe:
          #   httpGet:
          #    path: /
          #    port: linkwarden-http
          # startupProbe:
          #   httpGet:
          #     path: /
          #     port: linkwarden-http
          #   failureThreshold: 30
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
        
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: meilisearch-data-pvc
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-data-pvc
spec:
  storageClassName: managed-nfs-storage-retain
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-data-pvc
spec:
  storageClassName: managed-nfs-storage-retain
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: linkwarden-http-svc
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: linkwarden-http
  selector:
    app: linkwarden
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
spec:
  ports:
    - name: http
      port: 7700
      protocol: TCP
      targetPort: meilisearch
  selector:
    app: linkwarden
  type: ClusterIP
---
# Served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is terminated
# at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by kube-system/https-redirect.
# No request body limit on the gateway. Cilium leaves Envoy's 15 s route timeout in place unless a timeout is set;
# 0s disables it, closest to nginx (which had no total request timeout, only idle timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkwarden
  annotations:
    gethomepage.dev/description: "Collaborative bookmark manager, to collect, read, annotate and fully preserve"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Lifestyle"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/linkwarden/linkwarden/c7ab7678722fb5d62003123efebe59d8d9da1736/assets/logo.png"
    gethomepage.dev/name: "Linkwarden"
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - linkwarden.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: linkwarden-http-svc
          port: 3000
      timeouts:
        request: 0s
---