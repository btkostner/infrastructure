# https://github.com/schlagmichdoch/PairDrop/blob/master/docs/host-your-own.md

--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pairdrop
  name: pairdrop
#  namespace: pairdrop
spec:
  selector:
    matchLabels:
      app: pairdrop
  template:
    metadata:
      labels:
        app: pairdrop
        app.kubernetes.io/name: pairdrop # required for Homepage
    spec:
      # imagePullSecrets:
      #   # Required to pull from private harbor repo
      #   - name: harbor-devuser-registry-secret
      containers:
        - name: pairdrop
          image: lscr.io/linuxserver/pairdrop:1.11.2 # as at 20251229 
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Australia/Sydney"
            - name: WS_FALLBACK  # Set to true to enable websocket fallback if the peer to peer WebRTC connection is not available to the client.
              value: "false"
            - name: RATE_LIMIT # Set to true to limit clients to 1000 requests per 5 min.
              value: "false"
            - name: RTC_CONFIG # Set to the path of a file that specifies the STUN/TURN servers.
              value: "false"
            - name: DEBUG_MODE # Set to true to debug container and peer connections.
              value: "false" #This is quite useful to check whether the #HTTP-Server is configured correctly, so the auto-discovery feature works correctly.
          ports:
            - containerPort: 3000
              name: pairdrop-http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
            limits:
              cpu: "250m"
              memory: "1000Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pairdrop-http-svc
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: pairdrop-http
  selector:
    app: pairdrop
  type: ClusterIP
---
# Served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is terminated
# at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by kube-system/https-redirect.
# No request body limit on the gateway. Cilium leaves Envoy's 15 s route timeout in place unless a timeout is set;
# 0s disables it, closest to nginx (which had no total request timeout, only idle timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pairdrop
  annotations:
    gethomepage.dev/description: "Transfer Files Cross-Platform"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Utils"
    gethomepage.dev/icon: "pairdrop"
    gethomepage.dev/name: "Pairdrop"
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - pairdrop.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pairdrop-http-svc
          port: 3000
      timeouts:
        request: 0s
---