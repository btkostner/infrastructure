
# Example chart: https://github.com/dixneuf19/brassberry-gitops/blob/main/spliit/spliit/values.yaml
#                https://github.com/dixneuf19/brassberry-gitops/blob/main/spliit/spliit/templates/manifests.yaml

--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: spliit
  name: spliit
#  namespace: spliit
spec:
  selector:
    matchLabels:
      app: spliit
  template:
    metadata:
      labels:
        app: spliit
        app.kubernetes.io/name: spliit # required for Homepage
    spec:
      containers:
        - name: spliit
          # https://github.com/spliit-app/spliit/pkgs/container/spliit 
          image: ghcr.io/spliit-app/spliit:1.19.0
          imagePullPolicy: Always
          env:
            # - name: PUID
            #   value: "1000"
            # - name: PGID
            #   value: "1000"
            - name: TZ
              value: "Australia/Sydney"
            # - name: POSTGRES_HOST
            #   value: "postgres-service"
            # - name: POSTGRES_NAME
            #   value: "spliit"
            # - name: POSTGRES_USER
            #   value: "spliit-user"
            # - name: POSTGRES_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: spliit-externalsecrets
            #       key: spliit-postgres-secret
            - name: POSTGRES_PRISMA_URL
              # value: "postgresql://postgres:${POSTGRES_PASSWORD}@db"
              valueFrom:
                secretKeyRef:
                  name: spliit-externalsecrets
                  key: spliit-postgres-url # templated by external secrets
            - name: POSTGRES_URL_NON_POOLING
              # value: "postgresql://postgres:${POSTGRES_PASSWORD}@db"
              valueFrom:
                secretKeyRef:
                  name: spliit-externalsecrets
                  key: spliit-postgres-url # templated by external secrets
            - name: POSTGRES_TIMEOUT
              value: "60"
          ports:
            - containerPort: 3000
              name: spliit-http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
            limits:
              cpu: "1000m"
              memory: "2000Mi"
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: spliit-http
          readinessProbe:
            httpGet:
             path: /api/health/readiness
             port: spliit-http
          startupProbe:
            httpGet:
              path: /api/health/readiness
              port: spliit-http
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spliit-http-svc
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: spliit-http
  selector:
    app: spliit
  type: ClusterIP
---
# Served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is terminated
# at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by kube-system/https-redirect.
# No request body limit on the gateway. Cilium leaves Envoy's 15 s route timeout in place unless a timeout is set;
# 0s disables it, closest to nginx (which had no total request timeout, only idle timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spliit
  annotations:
    gethomepage.dev/description: "Track and share expenses with friends and family"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Lifestyle"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/spliit-app/spliit/refs/heads/main/public/logo.svg"
    gethomepage.dev/name: "Spliit"
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - spliit.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: spliit-http-svc
          port: 80
      timeouts:
        request: 0s
---