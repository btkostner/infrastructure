# https://docs.cilium.io/en/stable/security/policy/language/
# Least-privilege policy for the Cloudflare tunnel connector (reviewed 20261114).
# Having any ingress/egress rule here puts the pods into default-deny for that direction.
#
# Egress requirements per https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/tunnel-with-firewall/
#   Required: region1/region2.v2.argotunnel.com on 7844 (TCP http2 / UDP quic).
#   Optional (deliberately NOT allowed): api.cloudflare.com, update.argotunnel.com, github.com (auto-update only,
#   and we run --no-autoupdate), pqtunnels.cloudflareresearch.com (error reporting). These resolve to shared
#   Cloudflare anycast IPs that front unrelated sites, so allowing them would open general HTTPS egress.
#   Blocking them may log errors; cloudflared still runs correctly.
#   The cftunnel.com / _v2-origintunneld names in Cloudflare's doc are SNI values for SNI-filtering firewalls, not needed here.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared-network-policy
spec:
  endpointSelector: {}  # all pods in this namespace
  ingress:
    # Nothing in the cluster needs to connect to cloudflared. Only the kubelet liveness probe (from the node) on the metrics port.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "2000"
              protocol: TCP
  egress:
    # Cluster DNS. The dns rule is mandatory: without it Cilium can't learn the IPs for the toFQDNs below.
    # matchPattern "*" kept on purpose: resolv.conf ndots:5 makes cloudflared query search-suffixed names first
    # (e.g. region1.v2.argotunnel.com.cloudflared.svc.cluster.local); filtering those risks breaking edge discovery.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # Cloudflare edge - the tunnel itself (required).
    - toFQDNs:
        - matchName: "region1.v2.argotunnel.com"
        - matchName: "region2.v2.argotunnel.com"
      toPorts:
        - ports:
            - port: "7844"
              protocol: ANY # TCP (http2) + UDP (quic)

    # Optional: only if "Enforce Access JWT validation" is turned on for the tunnel routes (Cloudflare dashboard).
    # cloudflared then fetches the Access signing keys from the team domain.
    # - toFQDNs:
    #     - matchName: "rockyroadrocks.cloudflareaccess.com"
    #   toPorts:
    #     - ports:
    #         - port: "443"
    #           protocol: TCP

    # ---- Tunnel routes: one rule per published hostname, exact service + targetPort ----
    # Cilium evaluates after service translation, so ports here are the pods' targetPorts.
    # Keep in sync with the tunnel's public hostnames (scripts/cloudflare-access-audit.py lists them).

    # gloomhaven.rockyroad.rocks -> ghs-http-svc.gloomhaven:8080
    - toServices:
        - k8sService:
            serviceName: ghs-http-svc
            namespace: gloomhaven
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # spliit.rockyroad.rocks -> spliit-http-svc.spliit:80 (targetPort 3000)
    - toServices:
        - k8sService:
            serviceName: spliit-http-svc
            namespace: spliit
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

    # cmui.rockyroad.rocks -> cmui-web-http-svc.cmui:80 (targetPort 8080)
    - toServices:
        - k8sService:
            serviceName: cmui-web-http-svc
            namespace: cmui
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # argo-cd.rockyroad.rocks -> argocd-server.argocd:80 (targetPort 8080)
    # (previously also allowed ALL ports to EVERY pod in argocd: repo-server, redis, controller - removed 20261114)
    - toServices:
        - k8sService:
            serviceName: argocd-server
            namespace: argocd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # cilium-hubble.rockyroad.rocks -> hubble-ui.kube-system:80 (targetPort 8081)
    - toServices:
        - k8sService:
            serviceName: hubble-ui
            namespace: kube-system
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP

    # homeassistant.rockyroad.rocks -> home-assistant-lb.home-assistant:8123
    # Home Assistant runs hostNetwork, so its endpoint is the node itself ("host" entity), not a pod.
    # Works because HA and cloudflared both run on maurice-02 (maurice is tainted). If either moves to another
    # node, add "remote-node" here. Allows only 8123 on the node.
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
