# Keycloak client secret for Wallos SSO (realm rockyroadrocks, client "wallos"). Rotated 2026-11-18.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wallos-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # exist before the Deployment that reads it
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: wallos-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: "7b32482c-2b3f-4f16-8eb0-b506009f950e"
