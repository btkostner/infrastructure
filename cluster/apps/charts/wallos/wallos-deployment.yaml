# https://github.com/ellite/Wallos?tab=readme-ov-file#docker-1

--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wallos
  name: wallos
#  namespace: wallos
spec:
  selector:
    matchLabels:
      app: wallos
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: wallos
        app.kubernetes.io/name: wallos # required for Homepage
    spec:
      containers:
        - name: wallos
          # 5.11.1 as at 20261118 https://github.com/ellite/Wallos/releases
          image: bellamy/wallos:5.11.1@sha256:182d4be4dae26834cc5cec3686bb142e78b0a139a0eb1059355d061d8c0de3e5
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Australia/Sydney"
            # Wallos drops OIDC/webhook/SMTP targets that resolve to private IPs unless allowlisted. Its OIDC token
            # and userinfo URLs (Admin → OIDC) call Keycloak's in-cluster Service directly (ClusterIP); the public
            # name resolves to the gateway's LAN IP. Replaces the Admin → Security allowlist entirely.
            - name: SSRF_ALLOWLIST
              value: "keycloak-service.keycloak.svc.cluster.local,keycloak.rockyroad.rocks"
            # SSO via Keycloak, declared here instead of Admin → OIDC: each OIDC_* variable overrides the database
            # value (the UI field greys out). No OIDC_ISSUER: discovery would replace the in-cluster token/userinfo
            # URLs with the public ones. The browser-facing URLs (auth, logout) must be public.
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: "Rockyroad"
            - name: OIDC_CLIENT_ID
              value: "wallos"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallos-oidc
                  key: client-secret
            - name: OIDC_AUTH_URL
              value: "https://keycloak.rockyroad.rocks/realms/rockyroadrocks/protocol/openid-connect/auth"
            - name: OIDC_TOKEN_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/rockyroadrocks/protocol/openid-connect/token"
            - name: OIDC_USERINFO_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/rockyroadrocks/protocol/openid-connect/userinfo"
            - name: OIDC_REDIRECT_URL
              value: "https://wallos.rockyroad.rocks/"
            - name: OIDC_LOGOUT_URL
              value: "https://keycloak.rockyroad.rocks/realms/rockyroadrocks/protocol/openid-connect/logout"
            - name: OIDC_USER_IDENTIFIER
              value: "sub"
            - name: OIDC_SCOPES
              value: "openid email profile"
            - name: OIDC_AUTO_CREATE_USER
              value: "false"
            - name: OIDC_DISABLE_PASSWORD_LOGIN
              value: "false"
            - name: OIDC_REQUIRE_EMAIL_VERIFIED
              value: "true"
          ports:
            - containerPort: 80
              name: wallos-http
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
            limits:
              cpu: "100m"
              memory: "500Mi"
          volumeMounts:
            - mountPath: /var/www/html/db
              name: wallos-db-pv
            - mountPath: /var/www/html/images/uploads/logos
              name: wallos-logos-pv
      volumes:
        - name: wallos-db-pv
          # If this is NFS backed, you may have to add the nolock mount option to the storage class
          persistentVolumeClaim:
            claimName: wallos-db-pvc
        - name: wallos-logos-pv
          # If this is NFS backed, you may have to add the nolock mount option to the storage class
          persistentVolumeClaim:
            claimName: wallos-logos-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
# If this is NFS backed, you may have to add the nolock mount option to the storage class
metadata:
  name: wallos-db-pvc
#  namespace: wallos
spec:
  storageClassName: managed-nfs-storage-retain
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
# If this is NFS backed, you may have to add the nolock mount option to the storage class
metadata:
  name: wallos-logos-pvc
#  namespace: wallos
spec:
  storageClassName: managed-nfs-storage-retain
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wallos-http-svc
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: wallos-http
  selector:
    app: wallos
  type: ClusterIP
---
# Served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is terminated
# at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by kube-system/https-redirect.
# No request body limit on the gateway. Cilium leaves Envoy's 15 s route timeout in place unless a timeout is set;
# 0s disables it, closest to nginx (which had no total request timeout, only idle timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wallos
  annotations:
    gethomepage.dev/description: "Open-Source Personal Subscription Tracker"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Lifestyle"
    gethomepage.dev/icon: "wallos"
    gethomepage.dev/name: "Wallos"
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - wallos.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: wallos-http-svc
          port: 80
      timeouts:
        request: 0s

