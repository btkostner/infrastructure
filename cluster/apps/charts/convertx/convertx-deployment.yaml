# https://github.com/schlagmichdoch/convertx/blob/master/docs/host-your-own.md

--- # deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: convertx
  name: convertx
#  namespace: convertx
spec:
  selector:
    matchLabels:
      app: convertx
  template:
    metadata:
      labels:
        app: convertx
        app.kubernetes.io/name: convertx # required for Homepage
    spec:
      # imagePullSecrets:
      #   # Required to pull from private harbor repo
      #   - name: harbor-devuser-registry-secret
      containers:
        - name: convertx
          image: ghcr.io/c4illin/convertx:v0.16.1 # as at 20251229 
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Australia/Sydney"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: convertx-externalsecrets
                  key: convertx-jwt-secret
            - name: HTTP_ALLOWED
              value: "false"
            - name: ALLOW_UNAUTHENTICATED
              value: "true"
            - name: AUTO_DELETE_EVERY_N_HOURS
              value: "24"
            - name: LANGUAGE
              value: "en"
          ports:
            - containerPort: 3000
              name: convertx-http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
            limits:
              cpu: "1000m"
              memory: "1000Mi"
          volumeMounts:
            - mountPath: /app/data
              name: convertx-storage-pv
      volumes:
        - name: convertx-storage-pv
          # If this is NFS backed, you may have to add the nolock mount option to the storage class
          persistentVolumeClaim:
            claimName: convertx-storage-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: convertx-storage-pvc
spec:
  storageClassName: managed-nfs-storage-retain
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: convertx-http-svc
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: convertx-http
  selector:
    app: convertx
  type: ClusterIP
---
# Served through Cilium's external-gateway (moved from the ingress-nginx Ingress 2026-11-15). TLS is terminated
# at the gateway with the *.rockyroad.rocks wildcard certificate; HTTP is redirected by kube-system/https-redirect.
# No request body limit on the gateway. Cilium leaves Envoy's 15 s route timeout in place unless a timeout is set;
# 0s disables it, closest to nginx (which had no total request timeout, only idle timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: convertx
  annotations:
    gethomepage.dev/description: "Online File Converter"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Productivity"
    gethomepage.dev/icon: "convertx"
    gethomepage.dev/name: "ConvertX"
spec:
  parentRefs:
    - name: external-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - convertx.rockyroad.rocks
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: convertx-http-svc
          port: 3000
      timeouts:
        request: 0s
---