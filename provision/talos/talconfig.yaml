---
allowSchedulingOnControlPlanes: true
clusterName: btkostner.network
controlPlane:
  patches:
    # System Upgrades
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            allowedKubernetesNamespaces:
              - system-upgrade
            allowedRoles:
              - os:admin
            enabled: true
  schematic:
    customization:
      extraKernelArgs:
        - cpufreq.default_governor=performance
        - ipv6.disable=1
        - net.ifnames=1
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ice-firmware
          - siderolabs/intel-ucode
          - siderolabs/iscsi-tools
          - siderolabs/thunderbolt
          - siderolabs/util-linux-tools
endpoint: https://talos.btkostner.network:6443
kubernetesVersion: v1.36.0
networkInterfaces:
  - deviceSelector:
      physical: true
    dhcp: true
    mtu: 9000
nodes:
  - hostname: nuc-1
    controlPlane: true
    ipAddress: 192.168.3.11
    installDisk: /dev/nvme0n1
    nodeLabels:
      cnpg.io/local-storage: "true"
      btkostner.network/local-storage: "true"
    patches:
      - |-
        machine:
          kubelet:
            extraMounts:
              - destination: /var/mnt/local-path-provisioner
                type: bind
                source: /var/mnt/local-path-provisioner
                options:
                  - bind
                  - rshared
                  - rw
  - hostname: nuc-2
    controlPlane: true
    ipAddress: 192.168.3.12
    installDisk: /dev/nvme0n1
    nodeLabels:
      cnpg.io/local-storage: "true"
      btkostner.network/local-storage: "true"
    patches:
      - |-
        machine:
          kubelet:
            extraMounts:
              - destination: /var/mnt/local-path-provisioner
                type: bind
                source: /var/mnt/local-path-provisioner
                options:
                  - bind
                  - rshared
                  - rw
  - hostname: nuc-3
    controlPlane: true
    ipAddress: 192.168.3.13
    installDisk: /dev/sdb
    nodeLabels:
      cnpg.io/local-storage: "true"
      btkostner.network/local-storage: "true"
    patches:
      - |-
        machine:
          kubelet:
            extraMounts:
              - destination: /var/mnt/local-path-provisioner
                type: bind
                source: /var/mnt/local-path-provisioner
                options:
                  - bind
                  - rshared
                  - rw
  - hostname: nuc-4
    controlPlane: false
    ipAddress: 192.168.3.14
    installDisk: /dev/nvme0n1
    nodeLabels:
      cnpg.io/local-storage: "true"
      btkostner.network/local-storage: "true"
    patches:
      - |-
        machine:
          kubelet:
            extraMounts:
              - destination: /var/mnt/local-path-provisioner
                type: bind
                source: /var/mnt/local-path-provisioner
                options:
                  - bind
                  - rshared
                  - rw
  - hostname: nuc-5
    controlPlane: false
    ipAddress: 192.168.3.15
    installDisk: /dev/sda
patches:
  # Cilium support
  - |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
    machine:
      features:
        kubePrism:
          enabled: true
          port: 7445
  # Networking
  - |-
    machine:
      features:
        hostDNS:
          enabled: false
          forwardKubeDNSToHost: false
      network:
        extraHostEntries:
          - ip: 192.168.3.11
            aliases:
              - talos.btkostner.network
          - ip: 192.168.3.12
            aliases:
              - talos.btkostner.network
          - ip: 192.168.3.13
            aliases:
              - talos.btkostner.network
      nodeLabels:
        bgp: "65020"
      time:
        servers:
          - 162.159.200.1
          - 162.159.200.123
  # Security
  - |-
    machine:
      features:
        rbac: false
  # Intel GPU support
  - |-
    machine:
      kernel:
        modules:
          - name: i915
# renovate: datasource=docker depName=ghcr.io/siderolabs/talos
talosVersion: 1.14.5
worker:
  schematic:
    customization:
      extraKernelArgs:
        - cpufreq.default_governor=performance
        - ipv6.disable=1
        - net.ifnames=1
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ice-firmware
          - siderolabs/intel-ucode
          - siderolabs/iscsi-tools
          - siderolabs/thunderbolt
          - siderolabs/util-linux-tools
